name: Auto Scrape Stream

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Puppeteer Chrome Browser
        run: npx puppeteer browsers install chrome

      - name: Run Scraper
        run: node scraper.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add stream.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update live stream url [skip ci]"
          git push origin main || git push origin master || echo "No changes to push"

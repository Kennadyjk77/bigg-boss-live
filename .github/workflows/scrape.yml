name: Auto Scrape Stream

on:
  schedule:
    - cron: '*/30 * * * *' # ஒவ்வொரு 30 நிமிடத்திற்கு ஒருமுறை இயங்கும்
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Scraper
        run: node scraper.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add stream.json
          git commit -m "Update live stream url [skip ci]" || exit 0
          git push
